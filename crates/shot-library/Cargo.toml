[package]
name = "shot-library"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screensnips library: scans a folder of shots + TOML sidecars into a searchable index. Sidecars are the source of truth; the index is always rebuildable from disk."

[dependencies]
shot-model = { path = "../shot-model" }
serde = { version = "1", features = ["derive"] }
